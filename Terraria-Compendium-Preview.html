function bossPanel(){const all=visibleBosses();if(!all.length)return `<div class="empty-search">Nenhum chefe nesta combinação de filtros.</div>`;const b=all.find(x=>x.id===state.boss)||all[0];state.boss=b.id;
 const prep=`${b.summon?`<button class="summon-art" data-item="${escapeHtml(b.summon)}" title="Detalhes do invocador">${sprite(b.summon,{size:'boss-sprite',icon:'✦'})}</button>`:''}`;
 return `<article class="boss-panel" style="--boss-accent:${b.phase==='inicio'?'#dcbc78':b.phase==='pre'?'#e89c70':b.phase==='hard'?'#79d8c4':b.phase==='pos'?'#b7a1ff':'#e9c67d'}"><div class="boss-hero"><div class="boss-hero-top"><span class="boss-step">ENCONTRO ${String(b.order).padStart(2,'0')} / ${bosses.length}</span><span class="boss-flags"><b>${escapeHtml(phases[b.phase].time)}</b>${b.optional?'<b class="optional">OPCIONAL</b>':'<b class="main">PROGRESSÃO</b>'}</span></div><div class="boss-main"><div class="boss-portrait">${sprite(b.sprite,{size:'boss-portrait-img',icon:'♛'})}</div><div class="boss-identity"><span class="overline">${escapeHtml(phases[b.phase].kicker)}</span><h2>${escapeHtml(b.pt)}</h2><p>${escapeHtml(b.en)}</p>${b.branch?`<span class="world-branch">◈ Exclusivo: ${escapeHtml(b.branch==='Corruption'?'Corrupção':'Carmesim')}</span>`:''}</div></div><div class="boss-summon"><div class="summon-icon">${prep||'<span class="invocation-symbol">✦</span>'}</div><div><small>COMO ENCONTRAR OU INVOCAR</small><p>${escapeHtml(b.how)}</p></div><div class="location-chip"><span>⌾</span><b>${escapeHtml(b.location)}</b></div></div></div><div class="boss-actions"><button type="button" data-copy-link aria-label="Copiar link direto para ${escapeHtml(b.pt)}">⛓ Copiar link deste chefe</button><span>Compartilhe este chefe e a classe escolhida.</span></div><div class="boss-note"><span>✧</span><div><b>Dica de progressão</b><p>${escapeHtml(b.note)}</p></div></div><details class="strategy-card"><summary>Como se preparar para este chefe <span aria-hidden="true">⌄</span></summary><ul>${(b.strategy||[]).map(t=>`<li>${escapeHtml(t)}</li>`).join('')}</ul><small>Estratégia em revisão — consulte a etapa e o seu modo de jogo.</small></details><div class="boss-loadouts"><div class="section-subheader"><div><span class="overline">EQUIPAMENTOS PARA ESTA LUTA</span><h3>Seu conjunto de batalha</h3></div><span class="gear-disclaimer">Recomendações, não itens obrigatórios</span></div><div class="mini-class-filters"><button data-class="all" class="class-filter ${state.classId==='all'?'selected':''}" aria-pressed="${state.classId==='all'}">Todas as classes</button>${Object.entries(classes).map(([id,c])=>`<button data-class="${id}" class="class-filter ${state.classId===id?'selected':''}" style="--class-accent:${c.color}" aria-pressed="${state.classId===id}"><span>${c.glyph}</span>${c.name}</button>`).join('')}</div>${(state.classId==='all'?Object.keys(classes):[state.classId]).map(c=>loadout(b,c)).join('')}</div></article>`}
function timeline(){return `<section id="chefes" class="wrap-section bosses-section">${sectionHead('A JORNADA COMPLETA','Seu próximo chefe começa aqui.','Do primeiro confronto ao Senhor da Lua. Escolha um chefe e veja o que equipar antes de entrar na arena.',`${bosses.length} chefes em destaque`)}<div id="filterArea">${filters()}</div><p id="searchStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p><div class="mobile-list-controls"><button type="button" data-list-toggle aria-expanded="${!state.listCollapsed}" aria-controls="bossListArea">${state.listCollapsed?'Mostrar lista de chefes':'Recolher lista de chefes'} ▾</button><span>Toque em um chefe para ir direto ao equipamento</span></div><div class="bosses-layout"><aside id="bossListArea" class="boss-aside ${state.listCollapsed?'is-collapsed':''}" aria-label="Chefes por progressão">${bossList()}</aside><div id="bossDetailArea">${bossPanel()}</div></div></section>`}
function prepSection(){return `<section id="preparo" class="wrap-section prep-section">${sectionHead('ANTES DA BATALHA','Preparação para chefes','Bônus de arena e consumíveis mudam muita coisa. Clique em qualquer item para consultar como obtê-lo sem sair do guia.')}<div class="prep-layout"><div class="prep-intro"><div class="prep-icon">⚗</div><div class="overline">CHECKLIST DE PREPARAÇÃO</div><h3>Uma boa arena pode salvar uma tentativa.</h3><p>Plataformas, espaço livre para esquivas, iluminação, fontes de regeneração e consumíveis adequados à sua classe são ferramentas valiosas.</p><div class="prep-tips"><span>✧ Use uma arena ampla</span><span>✧ Leve cura e comida</span><span>✧ Ajuste a mobilidade</span><span>✧ Prepare buffs antes de invocar</span></div><div class="prep-visual">${sprite('Campfire.png',{size:'prep-motif',icon:'♨'})}${sprite('Heart_Lantern.png',{size:'prep-motif',icon:'♥'})}${sprite('Bast_Statue.png',{size:'prep-motif',icon:'♜'})}</div></div><div class="prep-cards">${guide.preparation.map(p=>`<details class="prep-card" ${p.id==='essential'||p.id==='arena'?'open':''}><summary><span class="prep-kind">${p.id==='essential'?'◈':p.id==='arena'?'▧':'✧'}</span><span><strong>${escapeHtml(p.title)}</strong><small>${escapeHtml(p.desc)}</small></span><span class="prep-chevron">⌄</span></summary><div class="prep-items">${p.items.map(file=>`<button class="prep-item" data-item="${escapeHtml(file)}">${sprite(file,{size:'prep-sprite',icon:'✦'})}<span>${escapeHtml(titleOf(file))}<small>${escapeHtml(getInfo(file).tag)}</small></span><span class="prep-arrow">↗</span></button>`).join('')}</div></details>`).join('')}</div></div></section>`}
const eventSprites={'slime-rain':'King_Slime.png','goblin-army':'Goblin_Battle_Standard.png','blood-moon':'Bloody_Tear.png','pirate-invasion':'Pirate_Map.png','solar-eclipse':'Broken_Hero_Sword.png','old-ones-army':'Eternia_Crystal.png','pumpkin-moon':'Pumpkin_Moon_Medallion.png','frost-moon':'Naughty_Present.png','martian-madness':'Martian_Probe.png','lunar-events':'Celestial_Sigil.png','eclipse':'Broken_Hero_Sword.png'};
function eventSection(){return `<section id="eventos" class="wrap-section event-section">${sectionHead('ALÉM DA LINHA PRINCIPAL','Eventos que mudam a jornada','Encontros extras e eventos especiais influenciam equipamentos e a progressão. As fichas de chefes acima continuam sendo a referência principal.')}<div class="events-grid">${events.filter((e)=>e&&e.name).map(e=>`<div class="event-card"><div class="event-sprite">${sprite(eventSprites[e.id]||'Bloody_Tear.png',{size:'event-img',icon:'☼'})}</div><div><span>${escapeHtml(e.period||'Evento')}</span><h3>${escapeHtml(e.name)}</h3><p>${escapeHtml(e.description||'Encontro especial do Terraria Vanilla.')}</p></div></div>`).join('')}</div><div class="event-encounters"><h3>Chefes do Exército do Velho</h3><p>Encontros opcionais por nível do evento; sem equipamentos exclusivos inventados.</p><div class="events-grid">${(guide.eventEncounters||[]).map(e=>`<article class="event-card encounter-card"><div class="event-sprite">${sprite(e.sprite,{size:'event-img',icon:'♛'})}</div><span>${escapeHtml(e.event)}</span><h3>${escapeHtml(e.pt)} <small>(${escapeHtml(e.en)})</small></h3><p>${escapeHtml(e.when)}</p><small>Fonte conferida em ${escapeHtml(e.verifiedAt)}</small></article>`).join('')}</div></div><p class="events-note">Eventos apresentados como índice de consulta. Recomendações próprias por onda ainda estão em expansão.</p></section>`}
function footer(){return `<footer class="footer" id="rodape"><div class="footer-top"><div><div class="footer-brand"><span class="brand-emblem">T<span>✦</span></span><span class="brand-words">TERRARIA<small>COMPENDIUM</small></span></div><p>Projeto feito de fã para fã com foco em consulta rápida de progressão e classes no Terraria.</p></div><nav aria-label="Links rápidos"><a href="#inicio">Início</a><a href="#classes">Classes</a><a href="#chefes" data-jump-phase="inicio">Chefes Pré-Hardmode</a><a href="#chefes" data-jump-phase="hard">Chefes Hardmode</a><a href="#preparo">Preparação e Poções</a></nav></div><div class="footer-bottom"><small>Terraria, seus sprites, ícones, nomes de itens e personagens são marcas registradas e propriedade intelectual da Re-Logic. Este é um site independente, sem fins lucrativos, desenvolvido apenas como guia visual para a comunidade.</small><small>Referência: Terraria Wiki oficial • Conteúdo e direitos de imagem sujeitos às licenças aplicáveis • Guia beta em expansão</small></div></footer>`}
function modal(){if(!state.openItem)return '';const i=getInfo(state.openItem),back=state.openItem;const related=[];for(const b of bosses){for(const load of Object.values(groups[b.group])){if([...load.armor,...load.weapons,...load.accessories,...load.after].includes(back)){if(!related.some(x=>x.id===b.id))related.push(b);break}}}
 const status=i.review==='verificado'?'Verificado':i.hasGuidance?'Dica inicial':'Pendente';const recipe=i.review==='verificado'&&i.recipe;
 return `<div class="modal-screen" id="modalScreen" role="presentation"><div class="modal-shade" data-close-modal></div><section class="item-dialog" role="dialog" aria-modal="true" aria-labelledby="itemDialogTitle" tabindex="-1"><button class="close-modal" type="button" data-close-modal aria-label="Fechar ficha">×</button><div class="dialog-top"><div class="dialog-sprite">${sprite(back,{size:'modal-img',icon:'✦'})}</div><div class="dialog-title"><span class="overline">FICHA DE ITEM · <span class="review-status ${i.review==='verificado'?'verified':i.hasGuidance?'initial':'pending'}">${status}</span></span><h2 id="itemDialogTitle">${escapeHtml(i.pt||i.en)}</h2>${i.pt?`<p>${escapeHtml(i.en)}</p>`:`<p>Tradução pendente · nome original em inglês</p>`}</div></div><div class="dialog-body"><div class="item-property"><small>COMO CONSEGUIR</small><span class="property-tag">${escapeHtml(tagType(i))}</span><p>${escapeHtml(i.where)}</p></div>${recipe?`<div class="item-property verified-recipe"><small>RECEITA CONFERIDA</small><ul>${recipe.ingredients.map(x=>`<li>${escapeHtml(x.qty)} × ${escapeHtml(x.name)}</li>`).join('')}</ul><p><b>Estação:</b> ${escapeHtml(recipe.station)}</p></div>`:i.tag==='Craft'?`<div class="item-property"><small>RECEITA</small><p>Ingredientes e estação ainda não conferidos. Não exibimos receitas por suposição.</p></div>`:''}${i.note?`<div class="item-property"><small>POR QUE CONSIDERAR</small><p>${escapeHtml(i.note)}</p></div>`:''}${guide.ammo[back]?`<div class="item-property"><small>MUNIÇÃO INDICADA</small><button class="inline-sprite-link" data-item="${escapeHtml(guide.ammo[back])}">${sprite(guide.ammo[back],{size:'prep-sprite',icon:'➶'})} ${escapeHtml(titleOf(guide.ammo[back]))} ↗</button></div>`:''}${related.length?`<div class="item-property"><small>APARECE NAS ETAPAS</small><div class="related-bosses">${related.slice(0,8).map(b=>`<button data-related-boss="${escapeHtml(b.id)}">${escapeHtml(b.pt)} ↗</button>`).join('')}</div></div>`:''}<div class="review-note"><b>Estado dos dados: ${status}</b><p>${i.review==='verificado'?`Fonte e receita conferidas em ${escapeHtml(i.verifiedAt)} para ${escapeHtml(i.gameVersion)}. Não implica verificação das outras fichas.`:i.hasGuidance?'Dica inicial de obtenção, ainda sem validação individual na versão de referência.':'Esta ficha ainda não teve a obtenção confirmada. As lacunas permanecem visíveis.'}</p></div></div><div class="dialog-bottom"><a href="${escapeHtml(i.source||'https://terraria.wiki.gg/')}" target="_blank" rel="noopener noreferrer">Fonte para conferência ↗</a><button class="btn-main" type="button" data-close-modal>Voltar ao guia</button></div></section></div>`
}
function render(){const m=$('#app');m.innerHTML=hero()+classPanel()+timeline()+prepSection()+eventSection()+footer();$('#siteHeader').innerHTML=nav();$('#modalMount').innerHTML=modal();document.body.classList.toggle('modal-open',!!state.openItem);$('#footerYear').textContent='';}
function rerenderTimeline(){const list=visibleBosses();if(list.length&&!list.some(b=>b.id===state.boss))state.boss=list[0].id;$('#bossListArea').innerHTML=bossList();$('#bossDetailArea').innerHTML=bossPanel();const live=$('#searchStatus');if(live)live.textContent=`${list.length} ${list.length===1?'chefe encontrado':'chefes encontrados'}.`;}
function setClass(id){if(!allowedClass.has(id))return;state.classId=id;const scroll=window.scrollY;$('#classes').outerHTML=classPanel();rerenderTimeline();window.scrollTo({top:scroll,behavior:'instant'});savePreferences();updateRoute();}
function setPhase(id){if(!allowedPhase.has(id))return;state.phase=id;$('#filterArea').innerHTML=filters();rerenderTimeline();savePreferences();updateRoute();}
function setBoss(id){if(!bosses.some(b=>b.id===id))return;state.boss=id;rerenderTimeline();updateRoute();if(window.matchMedia('(max-width: 900px)').matches){state.listCollapsed=true;$('#bossListArea').classList.add('is-collapsed');const t=$('[data-list-toggle]');if(t){t.textContent='Mostrar lista de chefes ▾';t.setAttribute('aria-expanded','false')}$('#bossDetailArea').scrollIntoView({behavior:'smooth',block:'start'});}else $('#bossDetailArea').scrollIntoView({behavior:'smooth',block:'start'});}
function openItem(file){lastItemFocus=document.activeElement;state.openItem=file;$('#modalMount').innerHTML=modal();document.body.classList.add('modal-open');$('.close-modal')?.focus()}
function closeItem(){if(!state.openItem)return;state.openItem=null;$('#modalMount').innerHTML='';document.body.classList.remove('modal-open');if(lastItemFocus?.isConnected)lastItemFocus.focus();lastItemFocus=null}
function scrollToAnchor(id){const node=document.getElementById(id);if(node)window.scrollTo({top:node.getBoundingClientRect().top+window.scrollY-SCROLL_OFFSET,behavior:'smooth'});}
document.addEventListener('click',e=>{
 const toggle=e.target.closest('[data-list-toggle]');if(toggle){state.listCollapsed=!state.listCollapsed;$('#bossListArea').classList.toggle('is-collapsed',state.listCollapsed);toggle.setAttribute('aria-expanded',String(!state.listCollapsed));toggle.textContent=state.listCollapsed?'Mostrar lista de chefes ▾':'Recolher lista de chefes ▴';return}
 const copy=e.target.closest('[data-copy-link]');if(copy){const url=location.href;const old=copy.textContent;const show=()=>{copy.textContent='✓ Link copiado';setTimeout(()=>{if(copy.isConnected)copy.textContent=old},1800)};if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(show,()=>window.prompt('Copie o link:',url))}else window.prompt('Copie o link:',url);return}
 const menu=e.target.closest('[data-menu]');if(menu){state.menu=!state.menu;$('#siteHeader').innerHTML=nav();return}
 const item=e.target.closest('[data-item]');if(item){openItem(item.dataset.item);return}
 if(e.target.closest('[data-close-modal]')){closeItem();return}
 const rel=e.target.closest('[data-related-boss]');if(rel){closeItem();state.phase='all';$('#filterArea').innerHTML=filters();setBoss(rel.dataset.relatedBoss);scrollToAnchor('chefes');return}
 const c=e.target.closest('[data-class]');if(c){const fromCard=Boolean(c.closest('.class-card'));setClass(c.dataset.class);if(fromCard&&window.matchMedia('(max-width: 900px)').matches)scrollToAnchor('chefes');return}
 const b=e.target.closest('[data-boss]');if(b){setBoss(b.dataset.boss);return}
 const p=e.target.closest('[data-phase]');if(p){setPhase(p.dataset.phase);return}
 if(e.target.closest('[data-reset]')){state.phase='all';state.evil='all';state.query='';state.optional=true;$('#filterArea').innerHTML=filters();rerenderTimeline();return}
 const footerPhase=e.target.closest('[data-jump-phase]');if(footerPhase){setPhase(footerPhase.dataset.jumpPhase)}
 const navLink=e.target.closest('#siteHeader a[href^="#"]');if(navLink&&state.menu){state.menu=false;$('#siteHeader').innerHTML=nav()}
});
document.addEventListener('input',e=>{if(e.target.id==='bossSearch'){state.query=e.target.value;rerenderTimeline()}});
document.addEventListener('change',e=>{if(e.target.id==='showOptional'){state.optional=e.target.checked;rerenderTimeline()}if(e.target.id==='evilFilter'){state.evil=e.target.value;rerenderTimeline();savePreferences();updateRoute()}});
document.addEventListener('keydown',e=>{
 if(state.openItem&&e.key==='Tab'){const dialog=$('.item-dialog');if(!dialog)return;const focusable=[...dialog.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),[tabindex="0"]')].filter(el=>!el.hidden);if(!focusable.length)return;const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}return}
 if(e.key==='Escape'&&state.openItem){e.preventDefault();closeItem();return}
 if(e.key==='/'&&!(e.target instanceof HTMLInputElement)&&!(e.target instanceof HTMLTextAreaElement)){e.preventDefault();scrollToAnchor('chefes');$('#bossSearch')?.focus()}
});
document.addEventListener('error',e=>{
 const img=e.target;if(!(img instanceof HTMLImageElement)||!img.classList.contains('terraria-sprite'))return;
 const filename=img.dataset.file;if(!filename)return;
 if(img.dataset.fallbackTried!=='yes') {img.dataset.fallbackTried='yes';img.src=alternate(filename)}
 else{failedSprites.add(filename);document.querySelectorAll('img.terraria-sprite[data-file]').forEach(other=>{if(other.dataset.file!==filename)return;other.hidden=true;other.removeAttribute('src');other.closest('.sprite-box')?.classList.add('has-fallback')})}
},true);
window.addEventListener('hashchange',()=>{if(readRoute()){savePreferences();$('#classes').outerHTML=classPanel();$('#filterArea').innerHTML=filters();rerenderTimeline();requestAnimationFrame(()=>$('#bossDetailArea')?.scrollIntoView({block:'start'}));return}const id=location.hash.slice(1);if(/^[a-z-]{1,30}$/.test(id))scrollToAnchor(id)});
readPreferences();
const fromDirectLink=readRoute();
render();
if(fromDirectLink)requestAnimationFrame(()=>$('#bossDetailArea')?.scrollIntoView({block:'start'}));
else if(location.hash){const id=location.hash.slice(1);if(/^[a-z-]{1,30}$/.test(id))requestAnimationFrame(()=>scrollToAnchor(id))}

</script>
</body>
</html>
